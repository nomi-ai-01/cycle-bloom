<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF9F4"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Cycle Bloom</title>
<style>
:root{--bg:#FFF9F4;--card:#fff;--ink:#3a2a30;--mut:#8a7279;--rose:#E8798F;--soft:#FBE3E8;--bd:#f0dde1}
@media(prefers-color-scheme:dark){:root{--bg:#1f1619;--card:#2b2024;--ink:#f6e9ec;--mut:#b99da4;--soft:#4a2b34;--bd:#3d2c32}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
body.ur{direction:rtl;font-family:"Noto Nastaliq Urdu",system-ui,sans-serif;line-height:2}
.hidden{display:none!important}main,.wrap{max-width:480px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:.2em 0}h2{font-size:18px;margin:.3em 0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:14px 0}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:13px 16px;background:var(--soft);cursor:pointer;width:100%;margin-top:8px}
button.p{background:var(--rose);color:#fff;font-weight:600}button.d{background:#c0392b;color:#fff}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);margin:6px 0 10px}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto;margin:0}
.big{font-size:56px;font-weight:700;color:var(--rose);line-height:1}.alert{background:var(--soft);padding:12px;border-radius:12px;margin:10px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.g span{font-size:12px;color:var(--mut)}.g button{padding:10px 0;margin:0;border-radius:10px;background:transparent;width:auto}
.g .o{opacity:.35}.g .t{outline:2px solid var(--rose)}.g .l{background:var(--rose);color:#fff}.g .pr{background:var(--soft)}.g .ov{box-shadow:inset 0 -3px 0 #6bb6a6}.g .s{outline:2px solid var(--ink)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{border-radius:0;background:transparent;margin:0;padding:16px 4px}nav button.a{color:var(--rose);font-weight:700}
#lock{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}#lock .card{width:100%;max-width:340px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:100}#toast.on{opacity:1}
.err{color:#c0392b;min-height:1.2em}
</style></head><body>
<div id="lock" class="hidden"><div class="card"><h2>Cycle Bloom</h2><p class="mut" id="lt"></p><input id="upin" type="password" inputmode="numeric" maxlength="4"><p class="err" id="uerr"></p><button class="p" onclick="unlock()" id="ub"></button><button onclick="forgot()" id="fb"></button></div></div>
<div id="onb" class="hidden wrap"><h1>Cycle Bloom</h1><p class="mut" id="o1"></p><div class="card"><label>Language / زبان</label><select id="ol" onchange="S.lang=this.value;ui()"><option value="en">English</option><option value="ur">اردو</option></select><label id="o2"></label><input id="olast" type="date"><div class="row"><div><label id="o3"></label><input id="ocyc" type="number" value="28" min="15" max="60"></div><div><label id="o4"></label><input id="oper" type="number" value="5" min="1" max="10"></div></div><button class="p" onclick="begin()" id="o5"></button></div><p class="mut">No account. No tracking. Data stays on your device.</p></div>
<main id="app" class="hidden"><div id="v"></div></main>
<nav id="nav" class="hidden"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const T={en:{home:"Home",cal:"Calendar",set:"Settings",o1:"Your private period tracker.",o2:"First day of your last period",o3:"Cycle length",o4:"Period length",o5:"Start",day:"Today is day",next:"Next period",in:"in {n} days",today:"expected today",late:"is late by {n} days",none:"Log your last period to see predictions.",start:"＋ Period started today",avg:"Average cycle",days:"days",pl:"Period length",save:"Save",sel:"Selected day",per:"Period day",note:"Private note",lang:"Language",pin:"4-digit PIN (leave empty to remove)",exp:"Export backup",imp:"Import backup",del:"Delete all my data",saved:"Saved",wrong:"Wrong PIN",unl:"Unlock",lt:"Enter your PIN",fg:"Forgot PIN (erases data)",sure:"This will erase all data. Continue?",lock:"Lock app",est:"Estimates only. Not medical advice or contraception.",fut:"Future date not allowed",ph1:"Period",ph2:"Fertile window",ph3:"Follicular",ph4:"Luteal",lg:"Legend: filled = period, light = predicted, green line = ovulation window"},
ur:{home:"ہوم",cal:"کیلنڈر",set:"سیٹنگز",o1:"آپ کا نجی ماہواری ٹریکر۔",o2:"آخری ماہواری کا پہلا دن",o3:"سائیکل کے دن",o4:"ماہواری کے دن",o5:"شروع کریں",day:"آج دن ہے",next:"اگلی ماہواری",in:"{n} دن میں",today:"آج متوقع ہے",late:"{n} دن دیر سے ہے",none:"پیش گوئی کے لیے آخری ماہواری درج کریں۔",start:"＋ آج ماہواری شروع ہوئی",avg:"اوسط سائیکل",days:"دن",pl:"ماہواری کے دن",save:"محفوظ کریں",sel:"منتخب دن",per:"ماہواری کا دن",note:"نجی نوٹ",lang:"زبان",pin:"4 ہندسوں کا پن (خالی چھوڑیں تو ہٹ جائے گا)",exp:"بیک اپ ایکسپورٹ",imp:"بیک اپ امپورٹ",del:"میرا سارا ڈیٹا مٹائیں",saved:"محفوظ ہو گیا",wrong:"غلط پن",unl:"کھولیں",lt:"اپنا پن لکھیں",fg:"پن بھول گئے (ڈیٹا مٹ جائے گا)",sure:"سارا ڈیٹا مٹ جائے گا۔ جاری رکھیں؟",lock:"ایپ لاک کریں",est:"صرف اندازہ ہے۔ طبی مشورہ یا مانع حمل نہیں۔",fut:"آنے والی تاریخ درست نہیں",ph1:"ماہواری",ph2:"زرخیز دورانیہ",ph3:"فولیکولر",ph4:"لیوٹیل",lg:"بھرا ہوا = ماہواری، ہلکا = متوقع، سبز لکیر = اووولیشن"}};
const D={ok:0,lang:"en",cyc:28,per:5,logs:{},pin:""};
let S=D,tab="home",sel,cur=new Date();
try{S={...D,...JSON.parse(localStorage.getItem("cb")||"{}")}}catch(e){}
const save=()=>{try{localStorage.setItem("cb",JSON.stringify(S))}catch(e){toast("Could not save")}};
const t=(k,v={})=>(T[S.lang][k]||T.en[k]||k).replace(/\{(\w+)\}/g,(m,x)=>v[x]);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const P=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c,12)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const today=()=>iso(new Date());sel=today();
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2500)}
function starts(){const k=Object.keys(S.logs).filter(d=>S.logs[d].period).sort();return k.filter(d=>!S.logs[add(d,-1)]?.period)}
function avg(){const a=starts(),r=[];for(let i=1;i<a.length;i++){const n=diff(a[i-1],a[i]);if(n>=15&&n<=60)r.push(n)}const l=r.slice(-6);return l.length?Math.round(l.reduce((x,y)=>x+y,0)/l.length):+S.cyc||28}
function last(){return starts().filter(d=>d<=today()).pop()||null}
function nextP(){const s=last();if(!s)return null;let n=add(s,avg()),g=0;while(n<=today()&&g++<40)n=add(n,avg());return n}
function sha(s){return crypto&&crypto.subtle?crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(h=>[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")):Promise.resolve("f"+s)}
function ui(){document.body.classList.toggle("ur",S.lang==="ur");document.documentElement.dir=S.lang==="ur"?"rtl":"ltr";
["o1","o2","o3","o4","o5"].forEach(k=>$("#"+k).textContent=t(k));$("#lt").textContent=t("lt");$("#ub").textContent=t("unl");$("#fb").textContent=t("fg");
$("#nav").innerHTML=["home","cal","set"].map(k=>`<button class="${tab===k?"a":""}" onclick="tab='${k}';draw()">${t(k)}</button>`).join("")}
function phase(){const s=last();if(!s)return"";const d=diff(s,today())+1,l=avg();return d<=S.per?t("ph1"):d>=l-16&&d<=l-12?t("ph2"):d<l-16?t("ph3"):t("ph4")}
function draw(){ui();const v=$("#v");
if(tab==="home"){const s=last(),n=nextP();let m=t("none"),al="";if(n){const k=diff(today(),n);m=t("next")+": "+n;al=k===0?t("today"):t("in",{n:k})}
v.innerHTML=`<h1>Cycle Bloom</h1>${n&&diff(today(),n)<=5?`<div class="alert">${t("next")}: ${al}</div>`:""}<div class="card"><p class="mut">${t("day")}</p><div class="big">${s?diff(s,today())+1:"—"}</div><p>${phase()}</p><p class="mut">${m}</p></div><button class="p" onclick="startToday()">${t("start")}</button><div class="row"><div class="card"><p class="mut">${t("avg")}</p><h2>${avg()} ${t("days")}</h2></div><div class="card"><p class="mut">${t("pl")}</p><h2>${S.per} ${t("days")}</h2></div></div><p class="mut">${t("est")}</p>`}
if(tab==="cal"){const f=new Date(cur.getFullYear(),cur.getMonth(),1,12),mo=iso(f).slice(0,7),st=add(iso(f),-f.getDay());
const pd=new Set(),pr=new Set(),ov=new Set();starts().forEach(s=>{for(let i=0;i<S.per;i++)pd.add(add(s,i))});Object.keys(S.logs).forEach(d=>{if(S.logs[d].period)pd.add(d)});
let n=nextP(),g=0;while(n&&n.slice(0,7)<=mo&&g++<30){for(let i=0;i<S.per;i++)pr.add(add(n,i));const o=add(n,-14);for(let i=-3;i<=1;i++)ov.add(add(o,i));n=add(n,avg())}
const wd=S.lang==="ur"?["اتوار","پیر","منگل","بدھ","جمعرات","جمعہ","ہفتہ"]:["S","M","T","W","T","F","S"];let h=wd.map(x=>`<span>${x}</span>`).join("");
for(let i=0;i<42;i++){const d=add(st,i),c=[d.slice(0,7)!==mo?"o":"",d===today()?"t":"",d===sel?"s":"",pd.has(d)?"l":pr.has(d)?"pr":"",ov.has(d)?"ov":""].join(" ");h+=`<button class="${c}" onclick="sel='${d}';draw()">${+d.slice(8)}</button>`}
const x=S.logs[sel]||{};
v.innerHTML=`<div class="row"><button onclick="cur=new Date(cur.getFullYear(),cur.getMonth()-1,1,12);draw()">‹</button><h2 style="text-align:center;flex:2">${new Intl.DateTimeFormat(S.lang==="ur"?"ur-PK":"en",{month:"long",year:"numeric"}).format(f)}</h2><button onclick="cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);draw()">›</button></div><div class="card"><div class="g">${h}</div><p class="mut">${t("lg")}</p></div><div class="card"><h2>${t("sel")}: ${sel}</h2><label class="ck"><input type="checkbox" id="ip" ${x.period?"checked":""}> ${t("per")}</label><label>${t("note")}</label><textarea id="nt" rows="3" maxlength="800">${x.note||""}</textarea><button class="p" onclick="saveDay()">${t("save")}</button></div>`}
if(tab==="set"){v.innerHTML=`<h1>${t("set")}</h1><div class="card"><label>${t("lang")}</label><select id="sl"><option value="en">English</option><option value="ur">اردو</option></select><div class="row"><div><label>${t("o3")}</label><input id="sc" type="number" min="15" max="60" value="${S.cyc}"></div><div><label>${t("o4")}</label><input id="sp" type="number" min="1" max="10" value="${S.per}"></div></div><button class="p" onclick="saveSet()">${t("save")}</button></div><div class="card"><label>${t("pin")}</label><input id="sn" type="password" inputmode="numeric" maxlength="4"><button onclick="savePin()">${t("save")} PIN</button>${S.pin?`<button onclick="lockNow()">${t("lock")}</button>`:""}</div><div class="card"><button onclick="exportB()">${t("exp")}</button><button onclick="$('#imp').click()">${t("imp")}</button><input id="imp" type="file" accept=".json" class="hidden" onchange="importB(this.files[0])"><button class="d" onclick="wipe()">${t("del")}</button></div>`;$("#sl").value=S.lang}}
function startToday(){S.logs[today()]={...(S.logs[today()]||{}),period:true};save();draw();toast(t("saved"))}
function saveDay(){if(sel>today()){toast(t("fut"));return}const p=$("#ip").checked,n=$("#nt").value.trim();if(!p&&!n)delete S.logs[sel];else S.logs[sel]={period:p,note:n};save();draw();toast(t("saved"))}
function saveSet(){S.lang=$("#sl").value;S.cyc=Math.min(60,Math.max(15,+$("#sc").value||28));S.per=Math.min(10,Math.max(1,+$("#sp").value||5));save();draw();toast(t("saved"))}
async function savePin(){const p=$("#sn").value;if(p===""){S.pin="";save();draw();toast(t("saved"));return}if(!/^\d{4}$/.test(p)){toast("PIN = 4 digits");return}S.pin=await sha(p);save();draw();toast(t("saved"))}
function lockNow(){$("#lock").classList.remove("hidden");$("#app").classList.add("hidden");$("#nav").classList.add("hidden");$("#upin").value=""}
async function unlock(){if(await sha($("#upin").value)===S.pin){$("#lock").classList.add("hidden");$("#app").classList.remove("hidden");$("#nav").classList.remove("hidden");$("#uerr").textContent="";draw()}else $("#uerr").textContent=t("wrong")}
function forgot(){if(confirm(t("sure")))wipe(1)}
function wipe(f){if(!f&&!confirm(t("sure")))return;try{localStorage.removeItem("cb")}catch(e){}S={...D,logs:{}};location.reload()}
function exportB(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({cb:1,data:S})],{type:"application/json"}));a.download="cycle-bloom-"+today()+".json";a.click()}
async function importB(f){if(!f)return;try{const o=JSON.parse(await f.text());if(!o.cb||!o.data||!o.data.logs)throw 0;S={...D,...o.data};save();draw();toast(t("saved"))}catch(e){toast("Bad file")}}
function begin(){const l=$("#olast").value;if(!l||l>today()){toast(t("fut"));return}S.cyc=Math.min(60,Math.max(15,+$("#ocyc").value||28));S.per=Math.min(10,Math.max(1,+$("#oper").value||5));S.logs[l]={period:true};S.ok=1;save();$("#onb").classList.add("hidden");$("#app").classList.remove("hidden");$("#nav").classList.remove("hidden");draw()}
$("#olast").value=today();$("#ol").value=S.lang;ui();
if(!S.ok)$("#onb").classList.remove("hidden");else if(S.pin)lockNow();else{$("#app").classList.remove("hidden");$("#nav").classList.remove("hidden");draw()}
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>

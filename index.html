function starts(){return Object.keys(S.logs).filter(d=>S.logs[d].period).sort().filter(d=>!S.logs[add(d,-1)]?.period)}
function cycles(){const a=starts(),r=[];for(let i=1;i<a.length;i++){const n=diff(a[i-1],a[i]);if(n>=15&&n<=60)r.push({s:a[i],n})}return r}
const lens=()=>cycles().map(c=>c.n);
function avg(){const l=lens().slice(-6);return l.length?Math.round(l.reduce((x,y)=>x+y,0)/l.length):+S.cyc||28}
const plen=s=>{const e=S.logs[s]&&S.logs[s].end;return e&&e>=s?cl(diff(s,e)+1,1,14):+S.per||5};
function avgPer(){const a=starts().filter(s=>S.logs[s].end).slice(-6).map(plen);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):+S.per||5}
const last=()=>starts().filter(d=>d<=today()).pop()||null;
const expd=()=>{const s=last();return s?add(s,avg()):null};
function nextP(){const s=last();if(!s)return null;let n=add(s,avg()),g=0;while(n<today()&&g++<40)n=add(n,avg());return n}
function cs(){const s=last();if(!s)return null;const len=avg(),pl=plen(s),d=diff(s,today())+1,e=add(s,len),k=diff(today(),e);const mode=d<=pl?"p":k<0?"l":"n";return{s,len,pl,d,e,k,mode,red:mode==="l"||(mode==="n"&&k<=RED)}}
function segs(l,p){const f0=Math.max(p+1,l-16),f1=Math.max(f0,l-12);return[["ph1",p],["ph3",Math.max(0,f0-p-1)],["ph2",f1-f0+1],["ph4",Math.max(0,l-f1)]]}

function sha(s){return window.crypto&&crypto.subtle?crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(h=>[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")):Promise.resolve("f"+s)}
